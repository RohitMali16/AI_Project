spring.application.name=AI Interview Prep Assistant
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/interview_prep
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Groq AI API configuration
groq.api.key=${GROQ_API_KEY}
app.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}